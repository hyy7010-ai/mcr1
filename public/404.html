<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GraceFlow</title>
    <script type="text/javascript">
      // SPA fallback for GitHub Pages: remember the deep-link path, then load the app
      // at "/". index.html restores this path so a hard refresh stays on the same page.
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      location.replace(location.origin + '/');
    </script>
  </head>
  <body></body>
</html>
